name: EC2 Shopify compose deploy
description: Publish one immutable Shopify release to EC2 with automatic rollback.
inputs:
  ec2-host:
    required: true
  ec2-user:
    required: true
  deploy-path:
    required: true
  ec2-ssh-key:
    required: true
  security-group-id:
    required: false
  target:
    required: true
  release-sha:
    required: true
  compose-file:
    required: true
  service:
    required: true
  sqlite-path:
    required: true
  env-file:
    required: true
  smoke-url:
    required: true
runs:
  using: composite
  steps:
    - name: Validate deployment configuration
      shell: bash
      run: |
        set -euo pipefail
        test -n "${{ inputs.ec2-host }}"
        test -n "${{ inputs.ec2-user }}"
        test -n "${{ inputs.deploy-path }}"
        test -n "${{ inputs.ec2-ssh-key }}"
        [[ "${{ inputs.ec2-host }}" =~ ^[A-Za-z0-9.-]+$ ]]
        [[ "${{ inputs.ec2-user }}" =~ ^[A-Za-z0-9._-]+$ ]]
        [[ "${{ inputs.deploy-path }}" == /srv/shopify-clever ]]
        [[ "${{ inputs.target }}" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]]
        [[ "${{ inputs.release-sha }}" =~ ^[0-9a-f]{40}$ ]]

    - name: Check AWS CLI for temporary SSH ingress
      if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && inputs.security-group-id != '' }}
      shell: bash
      run: aws --version

    - name: Temporarily allow this runner to SSH to EC2
      if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && inputs.security-group-id != '' }}
      id: ssh_ingress
      shell: bash
      run: |
        set -euo pipefail
        runner_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
        runner_cidr="$runner_ip/32"
        echo "runner_cidr=$runner_cidr" >> "$GITHUB_OUTPUT"
        if aws ec2 authorize-security-group-ingress \
          --group-id "${{ inputs.security-group-id }}" \
          --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$runner_cidr,Description=shopify-clever-ci}]"; then
          echo "authorized=true" >> "$GITHUB_OUTPUT"
        else
          if aws ec2 describe-security-groups \
            --group-ids "${{ inputs.security-group-id }}" \
            --query "SecurityGroups[0].IpPermissions[?FromPort==\`22\` && ToPort==\`22\`].IpRanges[].CidrIp" \
            --output text | tr '\t' '\n' | grep -Fxq "$runner_cidr"; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
        fi

    - name: Configure SSH
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        install -m 600 /dev/null ~/.ssh/deploy_key
        printf '%s\n' "${{ inputs.ec2-ssh-key }}" > ~/.ssh/deploy_key
        touch ~/.ssh/known_hosts
        for attempt in 1 2 3; do
          if ssh-keyscan -4 -T 20 -H "${{ inputs.ec2-host }}" >> ~/.ssh/known_hosts; then
            exit 0
          fi
          sleep "$((attempt * 5))"
        done
        exit 1

    - name: Stage immutable release source on EC2
      shell: bash
      run: |
        set -euo pipefail
        run_id="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        incoming_path="${{ inputs.deploy-path }}/targets/${{ inputs.target }}/incoming/${{ inputs.release-sha }}-$run_id"
        incoming_marker="$incoming_path/.shopify-incoming"
        printf -v prepare_command \
          'test %q = /srv/shopify-clever && test -d /srv && available_kb=$(df -Pk /srv | awk '\''NR == 2 { print $4 }'\'') && test "$available_kb" -ge 1048576 && mkdir -p %q && printf '\''%%s\\n'\'' %q %q %q > %q' \
          "${{ inputs.deploy-path }}" \
          "$incoming_path" \
          "target=${{ inputs.target }}" \
          "sha=${{ inputs.release-sha }}" \
          "run_id=$run_id" \
          "$incoming_marker"
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
          "${{ inputs.ec2-user }}@${{ inputs.ec2-host }}" "$prepare_command"
        rsync -az --delete \
          --exclude '.git/' \
          --exclude '.shopify-incoming' \
          --exclude 'node_modules/' \
          --exclude 'build/' \
          --exclude 'dist/' \
          --exclude '.react-router/' \
          --exclude '.shopify/' \
          --exclude '.omx/' \
          --exclude 'backups/' \
          --exclude 'apps/delivery-api/' \
          --exclude 'infra/env/*.env' \
          --exclude 'infra/compose/.env*' \
          --exclude 'infra/compose/*.env' \
          --exclude 'data/' \
          --exclude '.DS_Store' \
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
          ./ "${{ inputs.ec2-user }}@${{ inputs.ec2-host }}:$incoming_path/"

    - name: Publish release transactionally on EC2
      shell: bash
      run: |
        set -euo pipefail
        run_id="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        incoming_path="${{ inputs.deploy-path }}/targets/${{ inputs.target }}/incoming/${{ inputs.release-sha }}-$run_id"
        script_path="$incoming_path/.github/actions/ec2-shopify-deploy/remote-deploy.sh"
        printf -v remote_command \
          'bash %q --deploy-path %q --target %q --release-sha %q --incoming-path %q --compose-file %q --service %q --sqlite-path %q --env-file %q --smoke-url %q --run-id %q' \
          "$script_path" \
          "${{ inputs.deploy-path }}" \
          "${{ inputs.target }}" \
          "${{ inputs.release-sha }}" \
          "$incoming_path" \
          "${{ inputs.compose-file }}" \
          "${{ inputs.service }}" \
          "${{ inputs.sqlite-path }}" \
          "${{ inputs.env-file }}" \
          "${{ inputs.smoke-url }}" \
          "$run_id"
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
          "${{ inputs.ec2-user }}@${{ inputs.ec2-host }}" "$remote_command"

    - name: Revoke temporary runner SSH ingress
      if: ${{ always() && steps.ssh_ingress.outputs.runner_cidr != '' && steps.ssh_ingress.outputs.authorized == 'true' }}
      shell: bash
      run: |
        aws ec2 revoke-security-group-ingress \
          --group-id "${{ inputs.security-group-id }}" \
          --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ssh_ingress.outputs.runner_cidr }}}]" || true
